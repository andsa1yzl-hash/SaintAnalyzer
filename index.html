<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стеклянный эффект · SaintAnalyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;         /* убираем прокрутку */
            background: #0b0e14;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        /* Контейнер на весь экран */
        .glass-container {
            position: fixed;          /* фиксируем на весь вьюпорт */
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Картинка на весь экран, с сохранением пропорций (заполняет, обрезая лишнее) */
        .glass-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;        /* заполняет весь экран, обрезая края */
            object-position: center;  /* центрируем */
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Стеклянный слой на весь экран */
        .glass-layer {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(14px) saturate(1.2) brightness(1.05);
            -webkit-backdrop-filter: blur(14px) saturate(1.2) brightness(1.05);
            border: 1px solid rgba(255, 255, 255, 0.20); /* тонкая кромка по периметру */
            box-shadow:
                0 0 40px rgba(255, 255, 255, 0.08) inset,
                0 0 30px rgba(0, 0, 0, 0.35) inset;
            pointer-events: none;
            z-index: 2;
            transition: backdrop-filter 0.25s ease, background 0.25s ease;
        }

        /* Блик поверх стекла — диагональный градиент */
        .glass-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.30) 0%,
                rgba(255, 255, 255, 0.0) 35%,
                rgba(255, 255, 255, 0.0) 65%,
                rgba(255, 255, 255, 0.12) 100%
            );
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Мягкое «оживление» при наведении — стекло чуть светлеет */
        .glass-container:hover .glass-layer {
            backdrop-filter: blur(10px) saturate(1.3) brightness(1.08);
            -webkit-backdrop-filter: blur(10px) saturate(1.3) brightness(1.08);
            background: rgba(255, 255, 255, 0.07);
        }

        /* Если браузер не поддерживает backdrop-filter — компенсируем плотностью */
        @supports not (backdrop-filter: blur(1px)) {
            .glass-layer {
                background: rgba(30, 30, 40, 0.45);
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <img
            src="https://github.com/andsa1yzl-hash/SaintAnalyzer/blob/main/Background.png?raw=true"
            alt="SaintAnalyzer Background"
            loading="eager"
            draggable="false"
        >
        <div class="glass-layer" aria-hidden="true"></div>
    </div>
</body>
</html>
